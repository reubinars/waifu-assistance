[workspace]
resolver = "3"
members = ["crates/island-core", "apps/island-bridge", "apps/island"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
windows = "0.62"
island-core = { path = "crates/island-core" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
